<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#fff;overflow:hidden} #cv{position:fixed;left:0;top:70px;width:390px;height:560px}</style></head>
<body><canvas id="cv" width="780" height="1120"></canvas>
<script>
const cv=document.getElementById('cv'), g=cv.getContext('2d'); const im=new Image();
im.onload=()=>{ g.drawImage(im,0,0,780,1120); let k=0; setInterval(()=>{ k++; g.fillStyle='hsl('+(k*67%360)+',80%,'+(30+k*13%50)+'%)'; g.fillRect(100+(k*53%300),200+(k*91%500),320,320); },300); };
im.src='http://127.0.0.1:8802/page1.png';
</script></body></html>
